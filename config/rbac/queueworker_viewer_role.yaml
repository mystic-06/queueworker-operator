# This rule is not used by the project queueworker-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.mystic-06.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: queueworker-operator
    app.kubernetes.io/managed-by: kustomize
  name: queueworker-viewer-role
rules:
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers/status
  verbs:
  - get
