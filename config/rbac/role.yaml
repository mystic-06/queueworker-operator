---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers/finalizers
  verbs:
  - update
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers/status
  verbs:
  - get
  - patch
  - update
