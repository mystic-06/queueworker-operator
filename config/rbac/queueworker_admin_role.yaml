# This rule is not used by the project queueworker-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over apps.mystic-06.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: queueworker-operator
    app.kubernetes.io/managed-by: kustomize
  name: queueworker-admin-role
rules:
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers
  verbs:
  - '*'
- apiGroups:
  - apps.mystic-06.github.io
  resources:
  - queueworkers/status
  verbs:
  - get
